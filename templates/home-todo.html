<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TODO LIST - Home</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <style>
      body {
       background: linear-gradient(to right, #74d481, #053505);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        color: #333;
      }

      h3, h4, h5 {
        color: #fff;
      }

      .container {
        margin-top: 50px;
      }

      .card {
        border-radius: 10px;
        transition: transform 0.2s;
      }

      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      .card-body {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.1rem;
      }

      .task-list {
        max-height: 450px;
        overflow-y: auto;
        padding-right: 5px;
      }

      .form-control {
        border-radius: 0.5rem;
      }

      .btn-primary {
        background-color: #ff7e5f;
        border: none;
      }

      .btn-primary:hover {
        background-color: #feb47b;
      }

      .btn-success {
        background-color: #43cea2;
        border: none;
      }

      .btn-success:hover {
        background-color: #185a9d;
      }

      .btn-danger {
        background-color: #ff4b1f;
        border: none;
      }

      .btn-danger:hover {
        background-color: #ff9068;
      }

      .task-input {
        display: flex;
        gap: 10px;
        margin-top: 30px;
      }

      .task-input > i {
        padding-block: 1rem;
      }

      .footer-form {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 700px;
        background: rgba(255, 255, 255, 0.95);
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="container text-center">
      <h3 class="mb-3">📝 Django ToDo App</h3>
      <p class="text-light mb-4">{% now "jS F Y" %}</p>

      <div class="row gx-4">
        <div class="col-md-7">
          <h4 class="text-light mb-3">My Day</h4>
          <div class="task-list">
            {% for task in tasks %}
            <div class="card mb-2">
              <div class="card-body">
                <span>{{ task.task }}</span>
                <span>
                  <a href="{% url 'mark_as_done' task.pk %}" class="btn btn-success btn-sm me-1">
                    <i class="fa fa-check"></i>
                  </a>
                  <a href="{% url 'edit_task' task.pk %}" class="btn btn-primary btn-sm me-1">
                    <i class="fa fa-pencil"></i>
                  </a>
                  <a href="{% url 'delete_task' task.pk %}" class="btn btn-danger btn-sm">
                    <i class="fa fa-trash"></i>
                  </a>
                </span>
              </div>
            </div>
            {% endfor %}
          </div>
        </div>
        <div class="col-md-5">
          <h4 class="text-light mb-3">Completed Tasks</h4>
          <div class="task-list">
            {% for task in completed_tasks %}
            <div class="card mb-2 bg-light">
              <div class="card-body d-flex justify-content-between align-items-center">
                <span class="text-decoration-line-through">{{ task.task }}</span>
                <a href="{% url 'mark_as_undone' task.pk %}" class="btn btn-danger btn-sm">
                  <i class="fa fa-trash"></i>
                </a>
              </div>
            </div>
            {% endfor %}
          </div>
        </div>
      </div>
    </div>
    <div class="footer-form">
      <form action="{% url 'addTask' %}" method="POST" class="task-input">
        {% csrf_token %}
        <input
          type="text"
          name="task"
          class="form-control"
          placeholder="Add a new task..."
          required
        />
        <button type="submit" class="btn btn-primary">
          <i class="fa fa-plus"></i> Add
        </button>
      </form>
    </div>
  </body>
</html>
